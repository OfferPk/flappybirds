<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Forest Flight — Hybrid Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin:0; min-height:100vh; background:#001a00; color:#e8ffe8; font-family:system-ui,sans-serif; }
    header { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; padding:12px 16px; background:rgba(0,0,0,.45); }
    #game-container { width:min(960px,100%); height:70vh; margin:16px auto; border:6px solid #5D4037; border-radius:12px; background:#222; }
    button { background:#4CAF50; color:#fff; border:0; border-radius:999px; padding:8px 14px; cursor:pointer; }
    button.active { background:#FF9800; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); align-items:center; justify-content:center; }
    .modal-content { background:#1a1a1a; padding:24px; border-radius:12px; width:min(420px,92vw); }
  </style>
</head>
<body>
  <header>
    <strong>Hybrid demo</strong>
    <div>
      <button id="flappy-mode-btn" class="active">Flappy</button>
      <button id="spin-mode-btn">Spin</button>
      <button id="leaderboard-btn">Leaderboard</button>
    </div>
    <div>
      <span id="user-display">Guest</span>
      <button id="login-btn">Login</button>
      <button id="register-btn">Register</button>
      <button id="logout-btn" style="display:none">Logout</button>
    </div>
  </header>
  <div id="game-container"></div>
  <div id="login-modal" class="modal"><div class="modal-content">
    <form id="login-form"><h2>Login</h2>
      <input id="login-username" placeholder="username" required style="width:100%;margin:8px 0;padding:8px">
      <input id="login-password" type="password" placeholder="password" required style="width:100%;margin:8px 0;padding:8px">
      <button type="submit">Login</button><div class="message"></div></form>
    <form id="register-form" style="display:none;margin-top:12px"><h2>Register</h2>
      <input id="register-username" placeholder="username" required style="width:100%;margin:8px 0;padding:8px">
      <input id="register-email" type="email" placeholder="email" required style="width:100%;margin:8px 0;padding:8px">
      <input id="register-password" type="password" placeholder="password" required style="width:100%;margin:8px 0;padding:8px">
      <button type="submit">Register</button><div class="message"></div></form>
  </div></div>
  <div id="leaderboard-modal" class="modal"><div class="modal-content">
    <button id="leaderboard-close">Close</button>
    <div id="leaderboard-container"></div>
  </div></div>
  <p style="text-align:center;opacity:.6"><a href="menu.html" style="color:#8f8">← Back to menu</a></p>
  <!-- Uses existing root modules (same files the old indexxx.html expected under js/) -->
  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script src="scores.js"></script>
  <script src="game.js"></script>
  <script src="wheel.js"></script>
  <script src="game-manager.js"></script>
  <script src="main.js"></script>
  <script>window.dataManager = window.dataManager || new DataManager();</script>
</body>
</html>
